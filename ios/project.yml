# Projet Xcode généré par XcodeGen sur le runner macOS.
# Aucun .xcodeproj n'est versionné : il est reconstruit à chaque build.
name: Pose

options:
  bundleIdPrefix: com.leorinaldi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Mode langage Swift 5 : évite que la concurrence stricte de Swift 6
    # transforme le build en mur d'erreurs si le runner passe à un Xcode plus récent.
    SWIFT_VERSION: "5.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Pose:
    type: application
    platform: iOS
    sources:
      - path: Sources
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Pose
        PRODUCT_BUNDLE_IDENTIFIER: com.leorinaldi.pose
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Pose
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        # Verrouillé en portrait : le cadrage à l'écran est alors
        # exactement celui de la photo enregistrée.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Pose affiche l'image de la caméra pour que tu puisses t'aligner sur une pose de référence.
          Aucune image n'est envoyée nulle part.
        NSPhotoLibraryAddUsageDescription: >-
          Pour enregistrer tes photos dans la photothèque. Pose n'accède jamais aux photos existantes.
